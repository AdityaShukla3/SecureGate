services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: securegate
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080" # the ONLY published port
    env_file: .env.docker
    depends_on:
      - db
      - redis
    restart: on-failure

  logs-service:
    build: .
    command: node services/dummy.js logs 4001
    env_file: .env.docker

  inventory-service:
    build: .
    command: node services/dummy.js inventory 4002
    env_file: .env.docker

volumes:
  pgdata: {}
